#cloud-config
# Baked into /oem/90_custom.yaml of the Hetzner image. Hetzner userdata (if any)
# lands in /oem/95_userdata via the built-in hetzner datasource and is applied on top.
hostname: kairos-{{ trunc 4 .MachineID }}

users:
  - name: kairos
    # console-only login (Hetzner web console); sshd refuses passwords
    passwd: "<sha512-crypt hash, set your own: openssl passwd -6>"
    groups: [admin]
    ssh_authorized_keys:
      - "ssh-rsa "
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINing1Lu1VZP8efm7gLf5i76PSTrTYgjoXzkBIZinGN7"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPj6tzr92FpIwRlee4kqgoKcVJl9xR5k71fTir7JbIKr"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDfgyJA74pdQn5RY76lissD3S/X/trcOXalmki+baKuE mudler@kairos-devbox"
      - "github:mudler"

k3s:
  enabled: true

# Debug-friendly kernel cmdline, applied from the next boot on (every boot,
# recovery included). Written straight into the OEM grubenv instead of using
# top-level `grub_options`: on kairos master the grub-options first-boot hook
# unmounts /oem (agent/internal/agent/hooks/gruboptions.go writeGrubenvToOem),
# so the provider bootstrap that runs right after it never sees `k3s:` and k3s
# stays down until the next reboot.
stages:
  initramfs:
    - name: "Debug kernel cmdline (tty0 last so the Hetzner web console is /dev/console)"
      if: '! $(command -v grub2-editenv || command -v grub-editenv) /oem/grubenv list | grep -q "^extra_cmdline=rd.immucore.debug"'
      commands:
        - $(command -v grub2-editenv || command -v grub-editenv) /oem/grubenv set "extra_cmdline=rd.immucore.debug rd.kairos.debug console=ttyS0,115200 console=tty0"
    - name: "sshd: keys only, allow tunnels for debugging"
      files:
        - path: /etc/ssh/sshd_config.d/00-debug.conf
          permissions: 0644
          content: |
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            AllowTcpForwarding yes
            ClientAliveCountMax 3
    # kairos-init's 05-kairos-hardening.conf lists OpenSSH 10 algorithms
    # (mlkem768x25519-sha256); OpenSSH 9.6 on Ubuntu 24.04 rejects the whole
    # file and sshd never starts. Keep only what this sshd supports.
    - name: "sshd: drop crypto algorithms this OpenSSH does not support"
      commands:
        - |
          f=/etc/ssh/sshd_config.d/05-kairos-hardening.conf
          [ -f "$f" ] && command -v ssh >/dev/null || exit 0
          for pair in "KexAlgorithms kex" "Ciphers cipher" "MACs mac" "HostKeyAlgorithms key"; do
            set -- $pair
            cur=$(awk -v k="$1" '$1 == k {print $2}' "$f")
            [ -n "$cur" ] || continue
            ssh -Q "$2" > /tmp/.ssh-supported
            new=$(echo "$cur" | tr ',' '\n' | grep -Fx -f /tmp/.ssh-supported | paste -sd, -)
            [ -n "$new" ] && [ "$new" != "$cur" ] && sed -i "s|^$1 .*|$1 $new|" "$f"
          done
          rm -f /tmp/.ssh-supported
  network:
    # Hadron's agetty prints no issue file on tty1, so write the status
    # straight to the VGA console (what the Hetzner web console shows) and to
    # serial. The issue.d copy is for anything that does read it.
    - name: "Show version, boot mode and IPs on the consoles"
      commands:
        - |
          mkdir -p /etc/issue.d
          . /etc/kairos-release
          mode=active; [ -e /run/cos/recovery_mode ] && mode=recovery; [ -e /run/cos/passive_mode ] && mode=passive
          {
            echo "Kairos $KAIROS_VERSION on $KAIROS_FLAVOR $KAIROS_FLAVOR_RELEASE ($KAIROS_SOFTWARE_VERSION_PREFIX $KAIROS_SOFTWARE_VERSION), boot: $mode"
            ip -o addr show scope global | awk '$2 ~ /^(en|eth)/ {print "  " $2 "  " $4}'
            echo "ssh kairos@<ip> | journalctl -b | /var/log/kairos/ | sudo kairos-agent logs"
            echo
          } > /etc/issue.d/90-kairos-debug.issue
          for t in /dev/tty1 /dev/ttyS0; do [ -c "$t" ] && { printf "\n"; cat /etc/issue.d/90-kairos-debug.issue; } > "$t" 2>/dev/null; done; true
