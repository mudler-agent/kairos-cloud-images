name: Build image

# Builds the Hadron BIOS disk image with build.sh and attaches it to a
# release, so the multi-GB upload happens from the runner.
on:
  workflow_dispatch:
    inputs:
      role:
        description: "k3s role"
        type: choice
        options: [server, worker]
        default: server
      firmware:
        description: "Add the server firmware from hadron-firmware/Dockerfile"
        type: boolean
        default: false
      hadron_tag:
        description: "Hadron tag"
        default: v0.6.1
      kairos_ref:
        description: "kairos-io/kairos ref"
        default: master
      auroraboot_ref:
        description: "kairos-io/AuroraBoot ref"
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: kairos-io/kairos
          ref: ${{ inputs.kairos_ref }}
          path: src/kairos
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: kairos-io/AuroraBoot
          ref: ${{ inputs.auroraboot_ref }}
          path: src/AuroraBoot

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/kairos/go.mod
          cache: false

      - name: Install qemu-img and xz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils xz-utils

      - name: Put the console password hash in the cloud-config
        env:
          CONSOLE_PASSWD_HASH: ${{ secrets.CONSOLE_PASSWD_HASH }}
        run: |
          if [ -z "$CONSOLE_PASSWD_HASH" ]; then
            echo "::error::secret CONSOLE_PASSWD_HASH is not set (openssl passwd -6)"; exit 1
          fi
          awk -v h="$CONSOLE_PASSWD_HASH" '/^    passwd: /{print "    passwd: \"" h "\""; next} {print}' cloud-config.yaml > "$RUNNER_TEMP/cc.yaml"
          grep -cF -- "passwd: \"$CONSOLE_PASSWD_HASH\"" "$RUNNER_TEMP/cc.yaml"

      - name: Build
        env:
          KAIROS_DIR: ${{ github.workspace }}/src/kairos
          AURORABOOT_DIR: ${{ github.workspace }}/src/AuroraBoot
          HADRON_TAG: ${{ inputs.hadron_tag }}
          FIRMWARE: ${{ inputs.firmware }}
          ROLE: ${{ inputs.role }}
          OUT: ${{ runner.temp }}/out
          CLOUD_CONFIG: ${{ runner.temp }}/cc.yaml
        run: ./build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/out
          FIRMWARE: ${{ inputs.firmware }}
          ROLE: ${{ inputs.role }}
          HADRON_TAG: ${{ inputs.hadron_tag }}
          KAIROS_REF: ${{ inputs.kairos_ref }}
          AURORABOOT_REF: ${{ inputs.auroraboot_ref }}
        run: |
          cd "$OUT"
          ksha=$(git -C "$GITHUB_WORKSPACE/src/kairos" rev-parse --short HEAD)
          asha=$(git -C "$GITHUB_WORKSPACE/src/AuroraBoot" rev-parse --short HEAD)
          os="hadron-$HADRON_TAG"; [ "$FIRMWARE" = true ] && os="hadron-fw-$HADRON_TAG"
          tag="$os-kairos-$ksha-k3s-$ROLE-bios-run$GITHUB_RUN_NUMBER"
          qcow=$(ls ./*.qcow2)
          {
            echo "Built by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "- OS: \`$os\` (firmware: \`$FIRMWARE\`)"
            echo "- kairos \`$KAIROS_REF\` at \`$ksha\`, AuroraBoot \`$AURORABOOT_REF\` at \`$asha\`, k3s $ROLE (flannel wireguard-native)"
            echo "- Disk: legacy BIOS, 20 GB"
            echo "- qcow2 URL: \`$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/${qcow#./}\`"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
            --title "$os + kairos $ksha + k3s $ROLE (BIOS, run $GITHUB_RUN_NUMBER)" \
            --notes-file notes.md ./*.qcow2 ./*.raw.xz SHA256SUMS
          echo "### $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
