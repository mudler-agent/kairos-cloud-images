name: Build image

# Builds one disk image with build.sh and attaches it to a release, so the
# multi-GB upload happens from the runner instead of a workstation.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "OS base"
        type: choice
        options: [hadron, hadron-fw, ubuntu]
        default: hadron-fw
      disk:
        description: "efi (OVHcloud, UEFI) or bios (Hetzner Cloud)"
        type: choice
        options: [efi, bios]
        default: efi
      kairos_ref:
        description: "kairos-io/kairos ref"
        default: master
      auroraboot_ref:
        description: "kairos-io/AuroraBoot ref"
        default: main
      hadron_tag:
        description: "Hadron tag (hadron and hadron-fw only)"
        default: v0.6.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: kairos-io/kairos
          ref: ${{ inputs.kairos_ref }}
          path: src/kairos
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: kairos-io/AuroraBoot
          ref: ${{ inputs.auroraboot_ref }}
          path: src/AuroraBoot

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/kairos/go.mod
          cache: false

      - name: Install qemu-img and xz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils xz-utils

      - name: Pick the base image and cloud-config
        id: base
        env:
          BASE: ${{ inputs.base }}
          HADRON_TAG: ${{ inputs.hadron_tag }}
        run: |
          case "$BASE" in
            hadron)    base="ghcr.io/kairos-io/hadron:$HADRON_TAG"; cc=cloud-config.yaml ;;
            hadron-fw) docker build --build-arg HADRON_TAG="$HADRON_TAG" -t "kairos-local/hadron-fw:$HADRON_TAG" hadron-firmware/
                       base="kairos-local/hadron-fw:$HADRON_TAG"; cc=cloud-config.yaml ;;
            ubuntu)    base="ubuntu:24.04"; cc=cloud-config-ubuntu.yaml ;;
          esac
          echo "image=$base" >> "$GITHUB_OUTPUT"
          echo "cloud_config=$cc" >> "$GITHUB_OUTPUT"

      - name: Put the console password hash in the cloud-config
        env:
          CONSOLE_PASSWD_HASH: ${{ secrets.CONSOLE_PASSWD_HASH }}
          CC: ${{ steps.base.outputs.cloud_config }}
        run: |
          if [ -z "$CONSOLE_PASSWD_HASH" ]; then
            echo "::error::secret CONSOLE_PASSWD_HASH is not set (openssl passwd -6)"; exit 1
          fi
          awk -v h="$CONSOLE_PASSWD_HASH" '/^    passwd: /{print "    passwd: \"" h "\""; next} {print}' "$CC" > "$RUNNER_TEMP/cc.yaml"
          grep -cF -- "passwd: \"$CONSOLE_PASSWD_HASH\"" "$RUNNER_TEMP/cc.yaml"

      - name: Build
        env:
          KAIROS_DIR: ${{ github.workspace }}/src/kairos
          AURORABOOT_DIR: ${{ github.workspace }}/src/AuroraBoot
          HADRON_TAG: ${{ inputs.hadron_tag }}
          BASE_IMAGE: ${{ steps.base.outputs.image }}
          DISK: ${{ inputs.disk }}
          OUT: ${{ runner.temp }}/out
          CLOUD_CONFIG: ${{ runner.temp }}/cc.yaml
        run: ./build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/out
          BASE: ${{ inputs.base }}
          DISK: ${{ inputs.disk }}
          HADRON_TAG: ${{ inputs.hadron_tag }}
          KAIROS_REF: ${{ inputs.kairos_ref }}
          AURORABOOT_REF: ${{ inputs.auroraboot_ref }}
        run: |
          cd "$OUT"
          ksha=$(git -C "$GITHUB_WORKSPACE/src/kairos" rev-parse --short HEAD)
          asha=$(git -C "$GITHUB_WORKSPACE/src/AuroraBoot" rev-parse --short HEAD)
          case "$BASE" in ubuntu) os="ubuntu-24.04" ;; *) os="$BASE-$HADRON_TAG" ;; esac
          tag="$os-kairos-$ksha-$DISK-run$GITHUB_RUN_NUMBER"
          qcow=$(ls ./*.qcow2)
          {
            echo "Built by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "- OS base: \`$os\`"
            echo "- kairos \`$KAIROS_REF\` at \`$ksha\`, AuroraBoot \`$AURORABOOT_REF\` at \`$asha\`, k3s"
            echo "- Disk: \`$DISK\`, 20 GB"
            [ "$DISK" = efi ] && echo "- EFI bootloader path: \`\\EFI\\BOOT\\BOOTX64.EFI\`"
            echo "- qcow2 URL: \`$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/${qcow#./}\`"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
            --title "$os + kairos $ksha + k3s ($DISK, run $GITHUB_RUN_NUMBER)" \
            --notes-file notes.md ./*.qcow2 ./*.raw.xz SHA256SUMS
          echo "### $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
